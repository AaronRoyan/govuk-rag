[project]
name = "govrag"
version = "0.1.0"
description = "Grounded Q&A over GOV.UK employment guidance: hybrid retrieval, reranking, cited answers and an eval harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.17",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "fastembed>=0.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.7",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
govrag = "govrag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # prompts and inline HTML are long strings; ruff format handles code
